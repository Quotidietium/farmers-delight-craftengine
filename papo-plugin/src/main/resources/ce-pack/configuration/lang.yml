    "chscomment.farmersdelight.advancement.get_mushroom_colony": "Neta Among Us，又是谐音，我也没辙啊……有更好翻译的麻烦联系 WuzgXY丨原文：Fungus Among Us"
    "chscomment.farmersdelight.advancement.obtain_netherite_knife": "Neta 美国总统 Harry Truman，表示的是“假如你缺乏精力与胆量，不能承受工作的压力，或是不能接受尖锐批评的勇气，那么你就不要谋求或担任高层的职位”或“没有金刚钻别揽瓷器活”，此处应联系其批评义翻译丨原文 If You Can't Take the Heat..."
    "chscomment.farmersdelight.advancement.place_campfire": "Neta 黑暗之魂"
    "effect.farmersdelight.comfort": "舒适"
    "effect.farmersdelight.comfort.0.desc": "使你对饥饿、缓慢和虚弱效果免疫。"
    "effect.farmersdelight.nourishment": "滋养"
    "effect.farmersdelight.nourishment.0.desc": "你不会再消耗饥饿值，除非需要借以恢复生命值。"
    "enchantment.farmersdelight.backstabbing": "背刺"
    "enchantment.farmersdelight.backstabbing.desc": "增加从后攻击目标时的伤害。"
