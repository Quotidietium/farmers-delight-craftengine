    "farmersdelight.advancement.eat_comfort_food.desc": "汤和炖菜对抵御寒冷和疾病很有好处！"
    "farmersdelight.advancement.eat_nourishing_food": "服务周到"
    "farmersdelight.advancement.eat_nourishing_food.desc": "一盘丰盛的食物会让你获得滋养很长一段时间！"
